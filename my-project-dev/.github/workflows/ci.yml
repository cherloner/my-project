name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 数据库测试
  test-database:
    name: Test Database Schema
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run database initialization
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -f database/init.sql
      
      - name: Verify tables created
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "\dt"

  # 代码检查（如果有后端代码）
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      # 如果有Node.js项目，取消注释
      # - name: Install dependencies
      #   run: npm ci
      # 
      # - name: Run linter
      #   run: npm run lint

  # Docker构建测试
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Verify Docker Compose installation
        run: docker-compose --version
      
      - name: Build Docker Compose
        run: |
          docker-compose config

