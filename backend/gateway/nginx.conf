events {
    worker_connections 1024;
}

http {
    upstream auth_backend {
        server auth-service:8001;
    }

    upstream content_backend {
        server content-service:8002;
    }

    upstream upload_backend {
        server upload-service:8003;
    }

    upstream split_backend {
        server split-service:8004;
    }

    upstream course_backend {
        server course-service:8005;
    }

    upstream search_backend {
        server search-service:8006;
    }

    upstream notification_backend {
        server notification-service:8007;
    }

    server {
        listen 80;
        server_name localhost;

        # 认证相关接口
        location /api/auth {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 内容推荐、互动、关注接口
        location /api/feed {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/interaction {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/follow {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 视频上传接口
        location /api/videos/upload {
            proxy_pass http://upload_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10G;
        }

        # 视频拆分接口
        location /api/split {
            proxy_pass http://split_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 课程管理接口
        location /api/courses {
            proxy_pass http://course_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/learn {
            proxy_pass http://course_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 搜索接口
        location /api/search {
            proxy_pass http://search_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 消息通知接口
        location /api/inbox {
            proxy_pass http://notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

